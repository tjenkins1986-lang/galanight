<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gala Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1><a href="index.html">Gala Night</a></h1>
      <button class="secondary" id="logout-btn">Sign out</button>
    </header>

    <div class="actions-row" style="justify-content: space-between;">
      <a class="btn secondary" href="index.html">&larr; Back to trips</a>
      <div id="entry-actions" style="display: none; gap: 10px;">
        <a class="btn secondary icon-btn" id="edit-link" href="#">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
          Edit
        </a>
        <button type="button" class="secondary icon-btn danger" id="delete-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /></svg>
          Delete
        </button>
      </div>
    </div>

    <div id="content">
      <p class="empty-state">Loading…</p>
    </div>
  </div>

  <script type="module">
    import { doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import { db } from "./js/firebase.js";
    import { requireAuth, wireLogout } from "./js/require-auth.js";

    await requireAuth();
    wireLogout();

    const contentEl = document.getElementById("content");
    const id = new URLSearchParams(window.location.search).get("id");

    const sections = [
      ["ate", "Best thing you ate"],
      ["drank", "Best thing you drank"],
      ["saw", "Best thing you saw"],
      ["did", "Best thing you did"],
      ["wishedDone", "Thing you wished you had done"],
      ["highlight", "Highlight"],
    ];

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDateRange(start, end) {
      const opts = { year: "numeric", month: "long", day: "numeric" };
      const s = start ? new Date(start + "T00:00:00").toLocaleDateString(undefined, opts) : "";
      const e = end ? new Date(end + "T00:00:00").toLocaleDateString(undefined, opts) : "";
      if (s && e && s !== e) return `${s} – ${e}`;
      return s || e || "";
    }

    if (!id) {
      contentEl.innerHTML = `<p class="empty-state">No trip specified.</p>`;
    } else {
      try {
        const snap = await getDoc(doc(db, "memories", id));
        if (!snap.exists()) {
          contentEl.innerHTML = `<p class="empty-state">That trip couldn't be found.</p>`;
        } else {
          const t = snap.data();
          let html = `
            <div class="card">
              <h2 style="margin-top:0">${escapeHtml(t.tripName || "Untitled trip")}</h2>
              <div class="trip-meta" style="margin-bottom: 8px;">
                ${t.location ? `<span>📍 ${escapeHtml(t.location)}</span>` : ""}
                <span>🗓️ ${formatDateRange(t.startDate, t.endDate)}</span>
              </div>
            </div>
            <div class="card">
          `;
          for (const [key, label] of sections) {
            const value = t[key];
            if (!value) continue;
            html += `
              <div class="entry-section">
                <h3>${label}</h3>
                <p>${escapeHtml(value)}</p>
              </div>
            `;
          }
          html += `</div>`;
          contentEl.innerHTML = html;

          const actionsEl = document.getElementById("entry-actions");
          actionsEl.style.display = "flex";
          document.getElementById("edit-link").href = `add.html?id=${id}`;
          document.getElementById("delete-btn").addEventListener("click", async () => {
            if (!confirm(`Delete "${t.tripName || "this trip"}"? This can't be undone.`)) return;
            try {
              await deleteDoc(doc(db, "memories", id));
              window.location.href = "index.html";
            } catch (err) {
              alert("Couldn't delete this trip. Please try again.");
            }
          });
        }
      } catch (err) {
        contentEl.innerHTML = `<p class="empty-state">Couldn't load this trip.</p>`;
      }
    }
  </script>
</body>
</html>
