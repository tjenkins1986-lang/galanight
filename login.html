<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gala Night — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <h1>Gala Night</h1>
    <p class="tagline">Our travel memory book</p>

    <div class="card" style="display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center;">
      <p style="margin: 0; color: var(--text-mid); font-size: 0.92rem;">Sign in with the Google account you use for this trip book.</p>
      <button type="button" id="google-btn" style="width: 100%; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.96H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.04l2.97-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.96l2.97 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <script type="module">
    import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { auth } from "./js/firebase.js";

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    const googleBtn = document.getElementById("google-btn");
    const errorEl = document.getElementById("error");

    googleBtn.addEventListener("click", async () => {
      errorEl.textContent = "";
      googleBtn.disabled = true;
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = err.code === "auth/popup-closed-by-user"
          ? ""
          : "Couldn't sign in with Google. Please try again.";
        googleBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
